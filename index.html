<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="5S Walk">
<title>5S Walkthrough</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #1a1a1a; --card: #242424; --accent: #e8a525; --text: #e8e8e8;
  --muted: #888; --border: #333; --danger: #d44;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); -webkit-tap-highlight-color: transparent; }

/* Top bar */
.topbar { background: var(--card); border-bottom: 1px solid var(--border); padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
.topbar h1 { font-family: 'Bebas Neue', sans-serif; font-size: 28px; color: var(--accent); letter-spacing: 2px; margin: 0; }
.topbar-date { font-size: 12px; color: var(--muted); margin-top: 2px; }
.topbar-right { display: flex; gap: 8px; align-items: center; }
.badge { background: var(--bg); color: var(--accent); padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 700; border: 1px solid var(--border); }
.btn { padding: 8px 18px; border: none; border-radius: 6px; cursor: pointer; font-weight: 700; font-family: 'DM Sans', sans-serif; font-size: 13px; transition: background 0.2s; }
.btn-accent { background: var(--accent); color: #000; }
.btn-back { background: var(--text); color: #000; }
.btn-ghost { background: transparent; color: var(--text); border: 1.5px solid var(--border); }

/* Controls */
.controls { padding: 16px 20px; border-bottom: 1px solid var(--border); background: var(--card); }
.controls-label { font-size: 11px; color: var(--muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
.area-row, .zone-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.zone-row { gap: 6px; }
.zone-label { font-size: 11px; color: var(--muted); align-self: center; margin-right: 4px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; }
.area-btn { padding: 8px 16px; border-radius: 8px; border: 1.5px solid var(--border); background: transparent; color: var(--text); font-weight: 500; font-family: 'DM Sans', sans-serif; font-size: 13px; cursor: pointer; transition: all 0.15s; display: flex; align-items: center; gap: 6px; }
.area-btn.active { border-color: var(--accent); background: var(--accent); color: #000; font-weight: 700; }
.area-btn .count { padding: 1px 7px; border-radius: 10px; font-size: 11px; font-weight: 700; background: var(--bg); }
.area-btn.active .count { background: rgba(0,0,0,0.2); }
.zone-btn { padding: 5px 12px; border-radius: 6px; border: 1.5px solid var(--border); background: transparent; color: var(--muted); font-weight: 500; font-family: 'DM Sans', sans-serif; font-size: 12px; cursor: pointer; transition: all 0.15s; display: flex; align-items: center; gap: 5px; }
.zone-btn.active { border-color: var(--accent); background: rgba(232,165,37,0.15); color: var(--accent); font-weight: 700; }
.zone-btn .count { background: var(--bg); padding: 0px 5px; border-radius: 8px; font-size: 10px; font-weight: 700; color: var(--accent); }
.capture-btns { display: flex; gap: 8px; }
.btn-capture { flex: 1; padding: 14px; background: var(--accent); color: #000; border: none; border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer; font-family: 'DM Sans', sans-serif; }
.btn-upload { padding: 14px 20px; background: transparent; color: var(--text); border: 1.5px solid var(--border); border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; font-family: 'DM Sans', sans-serif; }

/* Photo grid */
.grid-section { padding: 16px 20px; padding-bottom: 100px; }
.area-header { font-family: 'Bebas Neue', sans-serif; font-size: 18px; letter-spacing: 1.5px; color: var(--accent); margin-bottom: 10px; padding-bottom: 6px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: baseline; }
.area-header .item-count { font-size: 12px; font-family: 'DM Sans', sans-serif; color: var(--muted); font-weight: 400; }
.sub-header { font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 8px; padding-left: 2px; text-transform: uppercase; letter-spacing: 0.5px; }
.photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; margin-bottom: 16px; }
.photo-card { background: var(--card); border-radius: 10px; overflow: hidden; border: 1px solid var(--border); }
.photo-card .img-wrap { position: relative; }
.photo-card img { width: 100%; height: 180px; object-fit: cover; display: block; }
.photo-card .actions { position: absolute; top: 8px; right: 8px; display: flex; gap: 4px; }
.photo-card .actions button { background: rgba(0,0,0,0.7); border: none; color: #fff; width: 32px; height: 32px; border-radius: 6px; cursor: pointer; font-size: 15px; display: flex; align-items: center; justify-content: center; }
.photo-card .actions .del-btn { color: var(--danger); }
.photo-card .tags { position: absolute; bottom: 8px; left: 8px; display: flex; gap: 4px; }
.photo-card .tag { padding: 3px 10px; border-radius: 4px; font-size: 11px; font-weight: 700; font-family: 'DM Sans', sans-serif; letter-spacing: 0.5px; }
.photo-card .tag-area { background: var(--accent); color: #000; }
.photo-card .tag-zone { background: rgba(232,165,37,0.25); color: var(--accent); }
.photo-card .desc { padding: 10px 12px; }
.photo-card textarea { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: var(--text); padding: 8px 10px; resize: vertical; font-family: 'DM Sans', sans-serif; font-size: 13px; outline: none; }
.empty { text-align: center; padding: 60px 20px; color: var(--muted); }
.empty-icon { font-size: 48px; margin-bottom: 12px; }

/* Annotation overlay */
.anno-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.92); z-index: 1000; display: flex; flex-direction: column; align-items: center; }
.anno-toolbar { padding: 10px 16px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; justify-content: center; background: var(--card); width: 100%; border-bottom: 1px solid var(--border); }
.anno-toolbar .sep { width: 1px; height: 24px; background: var(--border); }
.anno-toolbar .color-btn { width: 28px; height: 28px; border-radius: 50%; cursor: pointer; border: 2px solid #555; }
.anno-toolbar .color-btn.active { border: 3px solid #fff; }
.anno-toolbar .tool-btn { padding: 8px 14px; border: 1px solid var(--border); background: var(--card); color: var(--text); border-radius: 6px; cursor: pointer; font-family: 'DM Sans', sans-serif; font-size: 13px; }
.anno-toolbar .tool-btn.active { border-color: var(--accent); background: var(--accent); color: #000; font-weight: 700; }
.anno-toolbar .tool-btn.cancel { border-color: var(--danger); color: var(--danger); }
.anno-canvas-wrap { flex: 1; overflow: auto; display: flex; align-items: center; justify-content: center; padding: 10px; width: 100%; }
.anno-canvas-wrap canvas { max-width: 100%; max-height: calc(100vh - 70px); touch-action: none; border-radius: 4px; }

/* Comment modal (V1.4) — pops up after camera capture for quick note entry */
.comment-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); z-index: 1800; display: none; align-items: center; justify-content: center; padding: 16px; }
.comment-modal { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; max-width: 400px; width: 100%; max-height: calc(100vh - 32px); overflow-y: auto; }
.comment-modal h2 { font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 1.5px; color: var(--accent); margin-bottom: 12px; text-align: center; }
.comment-modal .preview-img { width: 100%; max-height: 200px; object-fit: contain; border-radius: 6px; background: var(--bg); display: block; margin-bottom: 10px; }
.comment-modal .preview-tags { display: flex; gap: 6px; margin-bottom: 12px; justify-content: center; flex-wrap: wrap; }
.comment-modal .preview-tag { padding: 4px 12px; border-radius: 4px; font-size: 11px; font-weight: 700; letter-spacing: 0.5px; }
.comment-modal .ptag-area { background: var(--accent); color: #000; }
.comment-modal .ptag-zone { background: rgba(232,165,37,0.25); color: var(--accent); border: 1px solid rgba(232,165,37,0.5); }
.comment-modal textarea { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: var(--text); padding: 10px 12px; font-family: 'DM Sans', sans-serif; font-size: 14px; resize: vertical; outline: none; margin-bottom: 14px; }
.comment-modal textarea:focus { border-color: var(--accent); }
.comment-modal .btn-save-comment { width: 100%; padding: 14px; background: var(--accent); color: #000; border: none; border-radius: 8px; font-size: 15px; font-weight: 700; font-family: 'DM Sans', sans-serif; cursor: pointer; }

/* Recompress banner (V1.3) */
.recompress-banner { position: fixed; top: 0; left: 0; right: 0; background: var(--accent); color: #000; padding: 12px 20px; text-align: center; font-weight: 700; font-size: 14px; z-index: 1500; display: none; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }

/* Resume overlay (V1.2) */
.resume-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); z-index: 2000; display: none; align-items: center; justify-content: center; padding: 20px; }
.resume-modal { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 28px 24px; max-width: 380px; width: 100%; text-align: center; }
.resume-modal h2 { font-family: 'Bebas Neue', sans-serif; font-size: 26px; letter-spacing: 1.5px; color: var(--accent); margin-bottom: 12px; }
.resume-modal p { font-size: 14px; color: var(--text); margin-bottom: 6px; line-height: 1.5; }
.resume-modal .meta { font-size: 12px; color: var(--muted); margin-bottom: 22px; }
.resume-modal .resume-btns { display: flex; flex-direction: column; gap: 10px; }
.resume-modal button { padding: 14px; border: none; border-radius: 8px; font-size: 14px; font-weight: 700; font-family: 'DM Sans', sans-serif; cursor: pointer; }
.resume-modal .btn-resume { background: var(--accent); color: #000; }
.resume-modal .btn-fresh { background: transparent; color: var(--text); border: 1.5px solid var(--border); }

/* ===== PRINT STYLES ===== */
@page { size: letter; margin: 0.4in 0.5in; }
@media print {
  body { background: #fff !important; color: #111 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .topbar, #captureMode, .anno-overlay, .print-controls, .resume-overlay, .recompress-banner, .comment-overlay { display: none !important; }
  #app { display: block !important; }
  #reportMode { display: block !important; }
  #reportContent { background: #fff !important; min-height: auto !important; }
  .report-section { page-break-after: always; padding: 0 !important; border: none !important; }
  .report-section:last-child { page-break-after: avoid; }
  .report-section img { max-height: 240px; }
}
</style>
</head>
<body>

<!-- Recompression banner (V1.3) -->
<div class="recompress-banner" id="recompressBanner">Optimizing photos… <span id="recompressProgress">0 of 0</span></div>

<!-- ========== SCREEN UI ========== -->
<div id="app">
  <div class="topbar">
    <div>
      <h1>5S WALKTHROUGH</h1>
      <div class="topbar-date" id="dateDisplay"></div>
    </div>
    <div class="topbar-right">
      <span class="badge" id="photoBadge">0 photos</span>
      <button class="btn btn-accent" id="reportBtn" style="display:none" onclick="toggleReport()">📄 Report</button>
    </div>
  </div>

  <!-- Capture mode -->
  <div id="captureMode">
    <div class="controls">
      <div class="controls-label">Select area, then add photos</div>
      <div class="area-row" id="areaRow"></div>
      <div class="zone-row" id="zoneRow" style="display:none"></div>
      <input type="file" id="fileInput" accept="image/*" multiple style="display:none" onchange="handleFiles(this)">
      <div class="capture-btns">
        <button class="btn-capture" onclick="takePhoto()">📷 Take Photo</button>
        <button class="btn-upload" onclick="uploadPhoto()">📁 Upload</button>
      </div>
    </div>
    <div class="grid-section" id="photoGrid"></div>
  </div>

  <!-- Report mode (on screen) -->
  <div id="reportMode" style="display:none">
    <div id="reportContent" style="background:#fff; min-height:calc(100vh - 70px)"></div>
    <div class="print-controls" style="padding:20px; text-align:center">
      <button class="btn btn-accent" onclick="printReport()" style="padding:12px 28px; font-size:15px">🖨 Print Report</button>
      <div style="font-size:11px; color:var(--muted); margin-top:8px">Opens your device's print dialog — print or save as PDF</div>
    </div>
  </div>
</div>

<!-- ========== RESUME OVERLAY (V1.2) ========== -->
<div class="resume-overlay" id="resumeOverlay">
  <div class="resume-modal">
    <h2>Resume Walkthrough?</h2>
    <p id="resumeSummary">You have a walkthrough in progress.</p>
    <p class="meta" id="resumeMeta"></p>
    <div class="resume-btns">
      <button class="btn-resume" onclick="resumeWalk()">Resume</button>
      <button class="btn-fresh" onclick="startFresh()">Start Fresh</button>
    </div>
  </div>
</div>

<!-- ========== COMMENT MODAL (V1.4) ========== -->
<div class="comment-overlay" id="commentOverlay">
  <div class="comment-modal">
    <h2>Add Note</h2>
    <img class="preview-img" id="commentPreviewImg" alt="Photo preview">
    <div class="preview-tags">
      <span class="preview-tag ptag-area" id="commentAreaTag"></span>
      <span class="preview-tag ptag-zone" id="commentZoneTag" style="display:none"></span>
    </div>
    <textarea id="commentInput" rows="3" placeholder="What needs correcting..."></textarea>
    <button class="btn-save-comment" onclick="saveComment()">Save</button>
  </div>
</div>

<!-- ========== ANNOTATION OVERLAY ========== -->
<div class="anno-overlay" id="annoOverlay" style="display:none">
  <div class="anno-toolbar">
    <button class="tool-btn active" data-tool="draw" onclick="setAnnoTool('draw',this)">✏️ Draw</button>
    <button class="tool-btn" data-tool="arrow" onclick="setAnnoTool('arrow',this)">↗ Arrow</button>
    <button class="tool-btn" data-tool="circle" onclick="setAnnoTool('circle',this)">◯ Circle</button>
    <span class="sep"></span>
    <button class="color-btn active" style="background:#e8a525" onclick="setAnnoColor('#e8a525',this)"></button>
    <button class="color-btn" style="background:#d44" onclick="setAnnoColor('#d44',this)"></button>
    <button class="color-btn" style="background:#4a4" onclick="setAnnoColor('#4a4',this)"></button>
    <button class="color-btn" style="background:#48f" onclick="setAnnoColor('#48f',this)"></button>
    <span class="sep"></span>
    <button class="tool-btn" onclick="annoUndo()">↩ Undo</button>
    <button class="tool-btn cancel" onclick="annoCancel()">✕ Cancel</button>
    <button class="tool-btn active" onclick="annoSave()">✓ Save</button>
  </div>
  <div class="anno-canvas-wrap">
    <canvas id="annoCanvas"></canvas>
  </div>
</div>

<script>
// ===== CONFIG =====
const AREAS = ["Drycast", "Wetcast", "OSP (Steel Shop)", "Yard"];
const SUBGROUPS = { "Drycast": ["P3", "Takeout", "MBK", "Lead"], "Wetcast": ["1A","1B","1C","2A","2B","2C","2D","Pour","Lead"] };

// Image compression settings (V1.3)
const COMPRESS_MAX_EDGE = 1024;
const COMPRESS_QUALITY = 0.7;
const COMPRESS_VERSION = 2; // bump when settings change → triggers re-compression of older saves

// ===== STORAGE (V1.2) =====
// Skeleton (areas, descriptions, photo IDs) → localStorage
// Photo blobs (dataUrls) → IndexedDB
const STORAGE_KEY = '5s-walkthrough-v1';
const DB_NAME = '5s-walkthrough';
const DB_STORE = 'photos';
let _dbPromise = null;

function openDB() {
  if (_dbPromise) return _dbPromise;
  _dbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(DB_STORE)) db.createObjectStore(DB_STORE);
    };
    req.onsuccess = (e) => resolve(e.target.result);
    req.onerror = (e) => reject(e.target.error);
  });
  return _dbPromise;
}

function idbPut(id, dataUrl) {
  return openDB().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(DB_STORE, 'readwrite');
    tx.objectStore(DB_STORE).put(dataUrl, String(id));
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  }));
}

function idbGet(id) {
  return openDB().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(DB_STORE, 'readonly');
    const req = tx.objectStore(DB_STORE).get(String(id));
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  }));
}

function idbDelete(id) {
  return openDB().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(DB_STORE, 'readwrite');
    tx.objectStore(DB_STORE).delete(String(id));
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  }));
}

function idbClear() {
  return openDB().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(DB_STORE, 'readwrite');
    tx.objectStore(DB_STORE).clear();
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  }));
}

// Save skeleton (no dataUrls) to localStorage
function saveSkeleton() {
  if (photos.length === 0) {
    localStorage.removeItem(STORAGE_KEY);
    return;
  }
  const skeleton = {
    schema: STORAGE_KEY,
    compressVersion: COMPRESS_VERSION,
    lastModified: Date.now(),
    photos: photos.map(p => ({
      id: p.id, area: p.area, subGroup: p.subGroup,
      description: p.description, timestamp: p.timestamp,
    })),
  };
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(skeleton)); }
  catch (e) { console.error('saveSkeleton failed:', e); }
}

// Read skeleton + rehydrate dataUrls from IDB
async function loadSaved() {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (!raw) return null;
  try {
    const skeleton = JSON.parse(raw);
    if (skeleton.schema !== STORAGE_KEY || !skeleton.photos?.length) return null;
    const rehydrated = await Promise.all(skeleton.photos.map(async p => {
      const dataUrl = await idbGet(p.id);
      return dataUrl ? { ...p, dataUrl } : null;
    }));
    const valid = rehydrated.filter(p => p !== null);
    if (valid.length === 0) return null;
    return {
      lastModified: skeleton.lastModified,
      compressVersion: skeleton.compressVersion || 1, // pre-V1.3 saves had no field
      photos: valid,
    };
  } catch (e) { console.error('loadSaved failed:', e); return null; }
}

async function clearAll() {
  localStorage.removeItem(STORAGE_KEY);
  try { await idbClear(); } catch (e) { console.error('idbClear failed:', e); }
}

function formatRelativeTime(ts) {
  const diff = Date.now() - ts;
  const mins = Math.round(diff / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return `${mins} minute${mins !== 1 ? 's' : ''} ago`;
  const hrs = Math.round(mins / 60);
  if (hrs < 24) return `${hrs} hour${hrs !== 1 ? 's' : ''} ago`;
  const days = Math.round(hrs / 24);
  if (days === 1) return 'yesterday';
  if (days < 7) return `${days} days ago`;
  return new Date(ts).toLocaleDateString('en-CA');
}

// ===== STATE =====
let photos = [];
let selectedArea = AREAS[0];
let selectedSubGroup = SUBGROUPS[selectedArea]?.[0] || null;
let viewMode = "capture"; // capture | report

// ===== DATE =====
function formatDate() {
  return new Date().toLocaleDateString("en-CA", { weekday:"long", year:"numeric", month:"long", day:"numeric" });
}
document.getElementById("dateDisplay").textContent = formatDate();

// ===== AREA & ZONE BUTTONS =====
function renderAreas() {
  const row = document.getElementById("areaRow");
  row.innerHTML = AREAS.map(a => {
    const count = photos.filter(p => p.area === a).length;
    const active = a === selectedArea ? "active" : "";
    const badge = count > 0 ? `<span class="count">${count}</span>` : "";
    return `<button class="area-btn ${active}" onclick="selectArea('${a}')">${a}${badge}</button>`;
  }).join("");
  renderZones();
}

function renderZones() {
  const row = document.getElementById("zoneRow");
  const subs = SUBGROUPS[selectedArea];
  if (!subs) { row.style.display = "none"; return; }
  row.style.display = "flex";
  row.innerHTML = `<span class="zone-label">Zone:</span>` + subs.map(sg => {
    const count = photos.filter(p => p.area === selectedArea && p.subGroup === sg).length;
    const active = sg === selectedSubGroup ? "active" : "";
    const badge = count > 0 ? `<span class="count">${count}</span>` : "";
    return `<button class="zone-btn ${active}" onclick="selectZone('${sg}')">${sg}${badge}</button>`;
  }).join("");
}

function selectArea(a) {
  selectedArea = a;
  selectedSubGroup = SUBGROUPS[a]?.[0] || null;
  renderAreas();
}

function selectZone(sg) {
  selectedSubGroup = sg;
  renderZones();
}

// ===== PHOTO CAPTURE =====
function takePhoto() {
  const input = document.getElementById("fileInput");
  input.setAttribute("capture", "environment");
  input.click();
}

function uploadPhoto() {
  const input = document.getElementById("fileInput");
  input.removeAttribute("capture");
  input.click();
}

// Compress image to reduce storage footprint (V1.1)
// Reads file → loads into <img> → draws to canvas at scaled size → re-encodes as JPEG.
// Skips work if image is already smaller than COMPRESS_MAX_EDGE on both axes.
function compressImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        const longest = Math.max(width, height);
        if (longest > COMPRESS_MAX_EDGE) {
          const scale = COMPRESS_MAX_EDGE / longest;
          width = Math.round(width * scale);
          height = Math.round(height * scale);
        }
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", COMPRESS_QUALITY));
      };
      img.onerror = () => resolve(e.target.result); // fallback to raw
      img.src = e.target.result;
    };
    reader.onerror = () => reject(reader.error);
    reader.readAsDataURL(file);
  });
}

// Re-compress an existing dataUrl (V1.3) — used to retroactively shrink photos saved under older settings
function recompressDataUrl(dataUrl) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      let { width, height } = img;
      const longest = Math.max(width, height);
      if (longest > COMPRESS_MAX_EDGE) {
        const scale = COMPRESS_MAX_EDGE / longest;
        width = Math.round(width * scale);
        height = Math.round(height * scale);
      }
      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, width, height);
      resolve(canvas.toDataURL("image/jpeg", COMPRESS_QUALITY));
    };
    img.onerror = () => resolve(dataUrl); // fallback: keep original
    img.src = dataUrl;
  });
}

// Run after Resume — re-encode any photos saved under older compression settings
async function recompressIfNeeded(loadedVersion) {
  if (loadedVersion >= COMPRESS_VERSION) return;
  if (photos.length === 0) return;
  const banner = document.getElementById('recompressBanner');
  const progress = document.getElementById('recompressProgress');
  banner.style.display = 'block';
  for (let i = 0; i < photos.length; i++) {
    progress.textContent = `${i + 1} of ${photos.length}`;
    const p = photos[i];
    const newDataUrl = await recompressDataUrl(p.dataUrl);
    p.dataUrl = newDataUrl;
    try { await idbPut(p.id, newDataUrl); } catch (e) { console.error('idbPut (recompress) failed:', e); }
    // yield so the browser can repaint the progress text
    await new Promise(r => setTimeout(r, 0));
  }
  saveSkeleton(); // stamps new compressVersion
  banner.style.display = 'none';
}

function handleFiles(input) {
  const files = Array.from(input.files);
  Promise.all(files.map(compressImage)).then(async dataUrls => {
    const newPhotos = dataUrls.map(dataUrl => ({
      id: Date.now() + Math.random(),
      dataUrl: dataUrl,
      area: selectedArea,
      subGroup: SUBGROUPS[selectedArea] ? selectedSubGroup : null,
      description: "",
      timestamp: new Date().toLocaleTimeString("en-CA", { hour:"2-digit", minute:"2-digit" }),
    }));
    photos.push(...newPhotos);
    // Persist (V1.2)
    await Promise.all(newPhotos.map(p => idbPut(p.id, p.dataUrl)));
    saveSkeleton();
    renderAll();
    // Single photo → pop comment modal (V1.4). Batch upload skips the modal.
    if (newPhotos.length === 1) {
      showCommentModal(newPhotos[0]);
    }
  });
  input.value = "";
}

// ===== COMMENT MODAL (V1.4) =====
let _commentPhotoId = null;

function showCommentModal(photo) {
  _commentPhotoId = photo.id;
  document.getElementById('commentPreviewImg').src = photo.dataUrl;
  document.getElementById('commentAreaTag').textContent = photo.area;
  const zoneTag = document.getElementById('commentZoneTag');
  if (photo.subGroup) {
    zoneTag.textContent = photo.subGroup;
    zoneTag.style.display = '';
  } else {
    zoneTag.style.display = 'none';
  }
  document.getElementById('commentInput').value = '';
  document.getElementById('commentOverlay').style.display = 'flex';
  // iOS sometimes needs a tick before focus + keyboard pop reliably
  setTimeout(() => document.getElementById('commentInput').focus(), 100);
}

function saveComment() {
  const text = document.getElementById('commentInput').value.trim();
  const p = photos.find(x => x.id === _commentPhotoId);
  if (p && text) {
    p.description = text;
    saveSkeleton();
  }
  _commentPhotoId = null;
  // Blur first to dismiss iOS keyboard, then hide
  document.getElementById('commentInput').blur();
  document.getElementById('commentOverlay').style.display = 'none';
  renderAll();
}

// ===== PHOTO ACTIONS =====
function deletePhoto(id) {
  photos = photos.filter(p => p.id !== id);
  idbDelete(id).catch(e => console.error('idbDelete failed:', e));
  saveSkeleton();
  renderAll();
}

let _descSaveTimer = null;
function updateDesc(id, desc) {
  const p = photos.find(p => p.id === id);
  if (p) p.description = desc;
  // Debounced save — don't hammer localStorage on every keystroke
  clearTimeout(_descSaveTimer);
  _descSaveTimer = setTimeout(saveSkeleton, 500);
  // Don't re-render — just update in place
}

// ===== GROUPING =====
function getGrouped() {
  const grouped = {};
  AREAS.forEach(area => {
    const areaPhotos = photos.filter(p => p.area === area);
    if (areaPhotos.length === 0) return;
    if (SUBGROUPS[area]) {
      const subs = {};
      SUBGROUPS[area].forEach(sg => {
        const sgPhotos = areaPhotos.filter(p => p.subGroup === sg);
        if (sgPhotos.length > 0) subs[sg] = sgPhotos;
      });
      const noSub = areaPhotos.filter(p => !p.subGroup);
      if (noSub.length > 0) subs["General"] = noSub;
      if (Object.keys(subs).length > 0) grouped[area] = { hasSubGroups: true, subGroups: subs, all: areaPhotos };
    } else {
      grouped[area] = { hasSubGroups: false, all: areaPhotos };
    }
  });
  return grouped;
}

// ===== RENDER =====
function renderAll() {
  renderAreas();
  renderPhotoGrid();
  document.getElementById("photoBadge").textContent = `${photos.length} photo${photos.length !== 1 ? "s" : ""}`;
  document.getElementById("reportBtn").style.display = photos.length > 0 ? "" : "none";
}

function renderPhotoGrid() {
  const container = document.getElementById("photoGrid");
  const grouped = getGrouped();
  if (photos.length === 0) {
    container.innerHTML = `<div class="empty"><div class="empty-icon">📷</div><div style="font-size:15px;font-weight:500">No photos yet</div><div style="font-size:13px;margin-top:6px">Select an area above and start snapping</div></div>`;
    return;
  }
  let html = "";
  for (const [area, gd] of Object.entries(grouped)) {
    html += `<div style="margin-bottom:28px"><div class="area-header"><span>${area}</span><span class="item-count">${gd.all.length} item${gd.all.length !== 1 ? "s" : ""}</span></div>`;
    if (gd.hasSubGroups) {
      for (const [sg, sgPhotos] of Object.entries(gd.subGroups)) {
        html += `<div class="sub-header">${sg}</div><div class="photo-grid">${sgPhotos.map(p => photoCardHTML(p)).join("")}</div>`;
      }
    } else {
      html += `<div class="photo-grid">${gd.all.map(p => photoCardHTML(p)).join("")}</div>`;
    }
    html += `</div>`;
  }
  container.innerHTML = html;
}

function photoCardHTML(p) {
  const zoneBadge = p.subGroup ? `<span class="tag tag-zone">${p.subGroup}</span>` : "";
  const esc = (p.description || "").replace(/"/g, "&quot;").replace(/</g, "&lt;");
  return `<div class="photo-card"><div class="img-wrap"><img src="${p.dataUrl}" alt=""><div class="actions"><button onclick="openAnnotation(${p.id})" title="Annotate">✏️</button><button class="del-btn" onclick="deletePhoto(${p.id})" title="Delete">✕</button></div><div class="tags"><span class="tag tag-area">${p.area}</span>${zoneBadge}</div></div><div class="desc"><textarea rows="2" placeholder="What needs correcting..." oninput="updateDesc(${p.id},this.value)">${esc}</textarea></div></div>`;
}

// ===== REPORT VIEW =====
const PHOTOS_PER_PAGE = 4; // V1.5: max photos per report page

// Split an array into chunks of fixed size: chunkArr([1,2,3,4,5,6,7], 4) → [[1,2,3,4],[5,6,7]]
function chunkArr(arr, size) {
  const out = [];
  for (let i = 0; i < arr.length; i += size) out.push(arr.slice(i, i + size));
  return out;
}

function toggleReport() {
  if (viewMode === "capture") {
    viewMode = "report";
    document.getElementById("captureMode").style.display = "none";
    document.getElementById("reportMode").style.display = "";
    document.getElementById("reportBtn").textContent = "← Back";
    document.getElementById("reportBtn").className = "btn btn-back";
    renderReportView();
  } else {
    viewMode = "capture";
    document.getElementById("captureMode").style.display = "";
    document.getElementById("reportMode").style.display = "none";
    document.getElementById("reportBtn").textContent = "📄 Report";
    document.getElementById("reportBtn").className = "btn btn-accent";
  }
}

// Emit one or more pages for a zone, chunked at PHOTOS_PER_PAGE (V1.5)
function emitZonePages(zoneTitle, photoList, dateStr) {
  const chunks = chunkArr(photoList, PHOTOS_PER_PAGE);
  return chunks.map((chunk, i) => {
    const title = chunks.length > 1
      ? `${zoneTitle} (Page ${i + 1} of ${chunks.length})`
      : zoneTitle;
    return reportPageHTML(title, chunk, dateStr);
  }).join("");
}

function renderReportView() {
  const grouped = getGrouped();
  const dateStr = formatDate();
  let html = "";
  for (const [area, gd] of Object.entries(grouped)) {
    if (gd.hasSubGroups) {
      for (const [sg, sgPhotos] of Object.entries(gd.subGroups)) {
        html += emitZonePages(`${area} — ${sg}`, sgPhotos, dateStr);
      }
    } else {
      html += emitZonePages(area, gd.all, dateStr);
    }
  }
  document.getElementById("reportContent").innerHTML = html;
}

function reportPageHTML(title, photoList, dateStr) {
  return `<div class="report-section" style="padding:24px 20px; border-bottom:3px solid #eee;">
    <div style="display:flex;justify-content:space-between;align-items:baseline;border-bottom:2.5px solid #222;padding-bottom:8px;margin-bottom:16px">
      <span style="font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:1.5px;color:#111">5S WALKTHROUGH</span>
      <span style="font-size:12px;color:#555;font-family:'DM Sans',sans-serif">${dateStr}</span>
    </div>
    <div style="font-family:'Bebas Neue',sans-serif;font-size:17px;letter-spacing:1px;color:#333;margin-bottom:14px;padding-bottom:4px;border-bottom:1.5px solid #ccc">${title}</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
      ${photoList.map(p => `<div><img src="${p.dataUrl}" style="width:100%;max-height:240px;object-fit:contain;border:1px solid #ddd;border-radius:4px;background:#f5f5f5">${p.description ? `<div style="font-size:11px;color:#333;margin-top:4px;line-height:1.4;font-family:'DM Sans',sans-serif">⚠ ${escHTML(p.description)}</div>` : ""}<div style="font-size:9px;color:#999;margin-top:2px">${p.timestamp}</div></div>`).join("")}
    </div>
  </div>`;
}

function escHTML(s) { return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

// Print wrapper (V1.3) — sets document.title before printing so iOS uses it as the default PDF filename
function printReport() {
  const d = new Date();
  const dateStr = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  const originalTitle = document.title;
  document.title = `5S Walkthrough - ${dateStr}`;
  window.print();
  // Restore after print dialog closes (best-effort; harmless if afterprint never fires on iOS)
  const restore = () => { document.title = originalTitle; };
  window.addEventListener('afterprint', restore, { once: true });
  setTimeout(restore, 60000); // safety net — restore after 1 minute regardless
}

// ===== ANNOTATION =====
let annoState = { photoId: null, img: null, paths: [], tool: "draw", color: "#e8a525", drawing: false, start: null };

function openAnnotation(id) {
  const p = photos.find(x => x.id === id);
  if (!p) return;
  annoState = { photoId: id, img: null, paths: [], tool: "draw", color: "#e8a525", drawing: false, start: null };
  const img = new Image();
  img.onload = () => {
    annoState.img = img;
    const canvas = document.getElementById("annoCanvas");
    canvas.width = img.width; canvas.height = img.height;
    annoRedraw();
    document.getElementById("annoOverlay").style.display = "flex";
  };
  img.src = p.dataUrl;
}

function annoRedraw() {
  const canvas = document.getElementById("annoCanvas");
  const ctx = canvas.getContext("2d");
  if (!annoState.img) return;
  ctx.drawImage(annoState.img, 0, 0);
  annoState.paths.forEach(p => {
    ctx.strokeStyle = p.color; ctx.lineWidth = p.lw; ctx.lineCap = "round"; ctx.lineJoin = "round";
    if (p.type === "path") { ctx.beginPath(); p.pts.forEach((pt,i) => i===0 ? ctx.moveTo(pt.x,pt.y) : ctx.lineTo(pt.x,pt.y)); ctx.stroke(); }
    else if (p.type === "arrow") { drawArrow(ctx, p.s, p.e, p.color, p.lw); }
    else if (p.type === "circle") { const r = Math.hypot(p.e.x-p.s.x, p.e.y-p.s.y); ctx.beginPath(); ctx.arc(p.s.x,p.s.y,r,0,Math.PI*2); ctx.stroke(); }
  });
}

function drawArrow(ctx, from, to, col, lw) {
  const hl = 15 + lw*3, a = Math.atan2(to.y-from.y, to.x-from.x);
  ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.fillStyle = col;
  ctx.beginPath(); ctx.moveTo(from.x,from.y); ctx.lineTo(to.x,to.y); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(to.x,to.y);
  ctx.lineTo(to.x - hl*Math.cos(a-Math.PI/6), to.y - hl*Math.sin(a-Math.PI/6));
  ctx.lineTo(to.x - hl*Math.cos(a+Math.PI/6), to.y - hl*Math.sin(a+Math.PI/6));
  ctx.closePath(); ctx.fill();
}

function getAnnoPos(e) {
  const canvas = document.getElementById("annoCanvas"), rect = canvas.getBoundingClientRect();
  const sx = canvas.width/rect.width, sy = canvas.height/rect.height;
  const cx = e.touches ? e.touches[0].clientX : e.clientX;
  const cy = e.touches ? e.touches[0].clientY : e.clientY;
  return { x: (cx-rect.left)*sx, y: (cy-rect.top)*sy };
}

document.getElementById("annoCanvas").addEventListener("mousedown", annoStart);
document.getElementById("annoCanvas").addEventListener("mousemove", annoMove);
document.getElementById("annoCanvas").addEventListener("mouseup", annoEnd);
document.getElementById("annoCanvas").addEventListener("touchstart", annoStart, {passive:false});
document.getElementById("annoCanvas").addEventListener("touchmove", annoMove, {passive:false});
document.getElementById("annoCanvas").addEventListener("touchend", annoEnd2, {passive:false});

function annoStart(e) {
  e.preventDefault();
  annoState.drawing = true;
  const pos = getAnnoPos(e);
  if (annoState.tool === "draw") annoState.paths.push({type:"path",pts:[pos],color:annoState.color,lw:4});
  else annoState.start = pos;
}

function annoMove(e) {
  if (!annoState.drawing) return;
  e.preventDefault();
  if (annoState.tool === "draw") {
    const last = annoState.paths[annoState.paths.length-1];
    if (last?.type === "path") { last.pts.push(getAnnoPos(e)); annoRedraw(); }
  }
}

function annoEnd(e) { annoFinish(getAnnoPos(e)); }
function annoEnd2(e) {
  e.preventDefault();
  const t = e.changedTouches[0], canvas = document.getElementById("annoCanvas"), rect = canvas.getBoundingClientRect();
  annoFinish({ x: (t.clientX-rect.left)*(canvas.width/rect.width), y: (t.clientY-rect.top)*(canvas.height/rect.height) });
}

function annoFinish(pos) {
  if (!annoState.drawing) return;
  annoState.drawing = false;
  if (annoState.tool !== "draw" && annoState.start) {
    annoState.paths.push({type:annoState.tool,s:annoState.start,e:pos,color:annoState.color,lw:4});
    annoState.start = null;
    annoRedraw();
  }
}

function setAnnoTool(t, btn) {
  annoState.tool = t;
  document.querySelectorAll(".anno-toolbar .tool-btn[data-tool]").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
}

function setAnnoColor(c, btn) {
  annoState.color = c;
  document.querySelectorAll(".anno-toolbar .color-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
}

function annoUndo() { annoState.paths.pop(); annoRedraw(); }
function annoCancel() { document.getElementById("annoOverlay").style.display = "none"; }
function annoSave() {
  const canvas = document.getElementById("annoCanvas");
  const dataUrl = canvas.toDataURL("image/jpeg", 0.85);
  const p = photos.find(x => x.id === annoState.photoId);
  if (p) {
    p.dataUrl = dataUrl;
    idbPut(p.id, dataUrl).catch(e => console.error('idbPut (anno) failed:', e));
    saveSkeleton();
  }
  document.getElementById("annoOverlay").style.display = "none";
  renderAll();
}

// ===== RESUME PROMPT (V1.2) =====
let _savedToResume = null;

function showResumePrompt(saved) {
  _savedToResume = saved;
  const n = saved.photos.length;
  document.getElementById("resumeSummary").textContent =
    `${n} photo${n !== 1 ? 's' : ''} from your last walkthrough.`;
  document.getElementById("resumeMeta").textContent =
    `Last activity: ${formatRelativeTime(saved.lastModified)}`;
  document.getElementById("resumeOverlay").style.display = "flex";
}

async function resumeWalk() {
  let loadedVersion = COMPRESS_VERSION;
  if (_savedToResume) {
    photos = _savedToResume.photos;
    loadedVersion = _savedToResume.compressVersion;
    _savedToResume = null;
  }
  document.getElementById("resumeOverlay").style.display = "none";
  renderAll();
  // Retroactively shrink photos saved under older compression settings
  await recompressIfNeeded(loadedVersion);
  renderAll();
}

async function startFresh() {
  _savedToResume = null;
  await clearAll();
  document.getElementById("resumeOverlay").style.display = "none";
  renderAll();
}

// ===== INIT =====
async function init() {
  let saved = null;
  try { saved = await loadSaved(); }
  catch (e) { console.error('loadSaved threw:', e); }
  if (saved && saved.photos.length > 0) {
    showResumePrompt(saved);
    renderAll(); // render empty state behind the modal
  } else {
    renderAll();
  }
}
init();
</script>
